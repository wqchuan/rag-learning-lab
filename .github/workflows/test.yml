name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Validate evaluation evidence
        run: python run.py validate-eval
      - name: Verify regression-v1
        run: |
          python run.py build
          python run.py evaluate --output /tmp/regression-v1.json
