[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-learning-lab"
version = "0.1.0"
description = "A small, inspectable RAG learning project for beginners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rag-lab = "rag_learning_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

